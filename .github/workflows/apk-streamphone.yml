name: APK StreamPhone

# Gera o APK do painel do fork (com o tema Nookdeck) e publica como release, para baixar direto no telefone:
#   https://github.com/joaovitormarquesdev/streamphone/releases/latest/download/StreamPhone.apk
# (é o link do QR "Instale o aplicativo" no pareamento do agente do fork).
# Assinatura: com os secrets PHONEBOX_KEYSTORE_BASE64, PHONEBOX_STORE_PASSWORD, PHONEBOX_KEY_ALIAS e
# PHONEBOX_KEY_PASSWORD usa a chave fixa; sem eles usa a chave de debug do runner, que muda a cada execução:
# aí cada APK novo pede para desinstalar o anterior (e parear de novo).

on:
  push:
    branches: [main, tema-nookdeck]
    paths: ['android/**', '.github/workflows/apk-streamphone.yml']
  workflow_dispatch:

permissions:
  contents: write # criar o release

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Restaurar a chave de assinatura (se houver)
        env:
          KEYSTORE: ${{ secrets.PHONEBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::warning::Sem secrets de assinatura: o APK sai com a chave de debug"; exit 0; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Compilar o APK de release
        working-directory: android
        env:
          PHONEBOX_STORE_FILE: ${{ runner.temp }}/release.keystore
          PHONEBOX_STORE_PASSWORD: ${{ secrets.PHONEBOX_STORE_PASSWORD }}
          PHONEBOX_KEY_ALIAS: ${{ secrets.PHONEBOX_KEY_ALIAS }}
          PHONEBOX_KEY_PASSWORD: ${{ secrets.PHONEBOX_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain
          mkdir -p ../out && cp app/build/outputs/apk/release/app-release.apk ../out/StreamPhone.apk
          rm -f "$RUNNER_TEMP/release.keystore"
      - name: Publicar o release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_SHA::7}"
          gh release create "$TAG" out/StreamPhone.apk --target "$GITHUB_SHA" --latest \
            --title "StreamPhone APK ${GITHUB_SHA::7} (${GITHUB_REF_NAME})" \
            --notes "APK do painel com o tema Nookdeck, do commit ${GITHUB_SHA::7} em ${GITHUB_REF_NAME}."
